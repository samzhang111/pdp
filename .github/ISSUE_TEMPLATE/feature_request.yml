name: Feature Request
description: Request a new feature or a change to existing features
title: "[FEATURE] <title>"
labels: ["enhancement"]
body:
  - type: checkboxes
    attributes:
      label: Is there an existing feature request for this?
      description:
        Please search to see if a request already exists for the feature you
        would like.
      options:
        - label: I have searched the existing feature requests
          required: true
  - type: textarea
    attributes:
      label: Motivation
      description: What would you like to see changed or added to the library?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed Solution
      description: How can this be accomplished?
    validations:
      required: false
  - type: textarea
    attributes:
      label: Anything else?
      description: |
        Links? References? Anything that will give us more context about your request!

        Tip: You can attach images or log files by clicking this area to highlight it and then dragging files in.
    validations:
      required: false
