[project]
name = "pdp"
version = "0.2.2"
description = "Principled Data Processing made easy"
authors = [
    {name = "Sam Z",email = "shimian.zhang@gmail.com"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ruamel-yaml (>=0.18.10,<0.19.0)",
    "typer (>=0.15.2,<0.16.0)",
    "rich (>=14.0.0,<15.0.0)"
]

[project.scripts]
pdp = "pdp.cli:app"

[project.optional-dependencies]
dagster = [
    "dagster>=1.13,<1.14",
    "dagster-webserver>=1.13,<1.14",
]

[dependency-groups]
dev = [
    "pytest (>=8.3.5,<9.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pyfakefs (>=5.8.0,<6.0.0)",
    "expects (>=0.9.0,<0.10.0)",
    "ipython (>=9.1.0,<10.0.0)",
    "pdp[dagster]",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

# The package lives at the project root (pdp/), not under src/.
[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
# Test warnings from PipesSubprocessClient.run
filterwarnings = [
    "ignore::DeprecationWarning:dagster._core.pipes.context",
    "ignore::dagster.PreviewWarning:dagster._core.pipes.context",
]

[tool.uv.sources]
pdp = { workspace = true }
